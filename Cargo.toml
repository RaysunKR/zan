[package]
name = "zan-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "_zan"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py38", "extension-module"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros", "fs"] }
httparse = "1"
percent-encoding = "2"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
rand = "0.8"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
